<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../style.css">
    <title>Vizitka</title>
    <style>

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;       
            justify-content: center;   
        }

        .vizitka {
            background-color: #fcd80f;
            border: 1px solid #fcd80f;
            border-radius: 16px;
            padding: 10px 14px 20px 14px;
            margin: 20px;
            width: 230px;
            text-align: left;
        }

        .vizitka img {
            width: 36px;
            height: 36px;
        }

        button {
            color: #721fdf;
            border: none;
            border-radius: 6px;
            padding: 18px 28px;
            font-size: 13px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="vizitka">
        <h1>
            Jáchym Kout
            <img src="profilovka.png" alt="Profilový obrázek">
        </h1>

        <p>Student informatiky na gymnáziu Arabská</p>

        <p>Co mám rád:</p>
        <ul>
            <li>Počítačové hry</li>
            <li>Sport</li>
            <li>Hudba</li>
        </ul>

        <button onclick="alert('Tlačítko funguje')">Kontaktujte mě</button>
    </div>
</body>
</html>
